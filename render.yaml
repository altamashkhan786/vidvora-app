services:
  - type: web
    name: vidvora-share-bot
    runtime: node
    plan: free
    rootDir: functions
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIRESTORE_DATABASE_ID
        value: ai-studio-android-garammas-738e4493-0090-419e-8ece-c55642a933ce
      - key: FIREBASE_STORAGE_BUCKET
        value: gen-lang-client-0000740810.firebasestorage.app
      - key: PLAYBACK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FINANCE_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_EMAIL_WEBHOOK_URL
        sync: false
      - key: WP_SITE_URL
        sync: false
      - key: WP_TELEGRAM_CHANNEL_ID
        sync: false
      - key: WP_AUTOPOST_SECRET
        sync: false
      - key: WP_POLL_INTERVAL_SECONDS
        value: "300"
      - key: WP_MAX_POSTS_PER_RUN
        value: "3"
      - key: WP_UPLOADER_NAME
        value: "VidVora Admin"

