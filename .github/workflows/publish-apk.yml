name: Build and Publish VidVora APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    name: Build & Publish VidVora APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: publish release/vidvora.apk')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build VidVora APK
        run: |
          echo "Building APK from source with Gradle..."
          gradle :app:assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk VidVora.apk

          unzip -tq VidVora.apk
          ACTUAL_SHA=$(sha256sum VidVora.apk | awk '{print $1}')
          APK_BYTES=$(wc -c < VidVora.apk)
          APK_HUMAN_SIZE=$(du -h VidVora.apk | awk '{print $1}')

          echo "sha256=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_HUMAN_SIZE}" >> "$GITHUB_OUTPUT"
        id: build_apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidVora-APK
          path: VidVora.apk

      - name: Publish APK to GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="vidvora-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ACTUAL_SHA="${{ steps.build_apk.outputs.sha256 }}"
          APK_BYTES="${{ steps.build_apk.outputs.size_bytes }}"
          RELEASE_NOTES=$(cat <<EOF
          VidVora Android APK built automatically.

          - **Tag:** \`${RELEASE_TAG}\`
          - **Asset:** \`VidVora.apk\`
          - **Size:** ${APK_BYTES} bytes
          - **SHA-256:** \`${ACTUAL_SHA}\`
          - **Commit:** \`${GITHUB_SHA}\`
          EOF
          )

          gh release create "$RELEASE_TAG" VidVora.apk \
            --latest \
            --title "VidVora APK (${RELEASE_TAG})" \
            --notes "$RELEASE_NOTES"

      - name: Save APK into release/vidvora.apk on GitHub
        run: |
          mkdir -p release functions
          cp VidVora.apk release/vidvora.apk
          printf "run=%s\nsha256=%s\n" "${GITHUB_RUN_NUMBER}" "${{ steps.build_apk.outputs.sha256 }}" > functions/.apk-release-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/vidvora.apk functions/.apk-release-sync
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish release/vidvora.apk (run ${GITHUB_RUN_NUMBER})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "release/vidvora.apk already up to date."
          fi
