  <style>
    :root {
      --bg: #070c18;
      --bg-panel: #091020;
      --card: #0e172a;
      --card-2: #14213b;
      --border: #1e2f4f;
      --cyan: #00e5ff;
      --cyan-soft: rgba(0, 229, 255, 0.13);
      --gold: #ffc107;
      --gold-soft: rgba(255, 193, 7, 0.13);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.13);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.13);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.45;
      overflow-x: hidden;
    }
    body {
      background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.06), transparent 42%),
                  radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.05), transparent 42%),
                  var(--bg);
    }
    button, input, select, textarea { font-family: inherit; }

    /* Desktop Control Bar (auto-hidden completely on mobile Chrome) */
    .desktop-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(7, 12, 24, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .desktop-bar.hidden { display: none; }
    .desktop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo-img {
      height: 30px;
      width: auto;
      display: block;
      object-fit: contain;
    }
    .seg-group {
      display: inline-flex;
      background: #0a1020;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      gap: 4px;
    }
    .seg-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active {
      background: linear-gradient(135deg, #00e5ff, #0ea5e9);
      color: #031320;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.25);
    }
    .seg-btn.active-admin {
      background: linear-gradient(135deg, #ffc107, #f59e0b);
      color: #1c1200;
      box-shadow: 0 4px 14px rgba(255, 193, 7, 0.25);
    }
    .seg-btn.active-tg {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
    }

    .sim-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.18);
    }
    .sim-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--cyan);
      font-weight: 800;
      margin-right: 4px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 36px;
    }
    .btn:hover { background: var(--card-2); border-color: #365080; }
    .btn:active { transform: scale(0.97); }
    .btn-cyan { background: linear-gradient(135deg, #00e5ff, #0284c7); color: #031320; border: 0; }
    .btn-cyan:hover { filter: brightness(1.07); }
    .btn-gold { background: linear-gradient(135deg, #ffc107, #f59e0b); color: #1b1100; border: 0; }
    .btn-gold:hover { filter: brightness(1.07); }
    .btn-green { background: linear-gradient(135deg, #22c55e, #16a34a); color: #031c0b; border: 0; }
    .btn-green:hover { filter: brightness(1.07); }
    .btn-purple { background: var(--purple-soft); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.4); }
    .btn-red { background: var(--red-soft); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 8px; min-height: 32px; }
    .btn-lg { padding: 12px 18px; font-size: 14px; border-radius: 12px; min-height: 44px; }

    /* Discreet restore pill on desktop only when topbar is hidden */
    .floating-restore-bar {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 95;
      display: none;
      opacity: 0.35;
      transition: opacity 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }
    .floating-restore-bar:hover { opacity: 1; }
    .floating-restore-bar.visible { display: inline-flex; }

    /* Workspace Container */
    .stage {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app-shell {
      width: 100%;
      max-width: 1180px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      transition: max-width 0.25s ease, border-radius 0.25s ease;
    }
    .app-shell.phone-mode {
      max-width: 420px;
      border-radius: 36px;
      border: 8px solid #1e293b;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75), 0 0 0 2px #334155;
    }
    .phone-notch {
      display: none;
      background: #060a14;
      padding: 8px 18px 6px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 700;
      justify-content: space-between;
      align-items: center;
    }
    .app-shell.phone-mode .phone-notch { display: flex; }

    /* Native Android-Style App TopAppBar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 13px 16px;
      padding-top: calc(13px + env(safe-area-inset-top, 0px));
      background: rgba(7, 12, 24, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(30, 47, 79, 0.75);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .app-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .app-logo-trigger {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      padding: 2px 0;
      text-align: left;
      min-width: 0;
    }
    .app-icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid rgba(0, 229, 255, 0.35);
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.16);
      flex-shrink: 0;
    }
    .app-wordmark {
      height: 24px;
      width: auto;
      display: block;
      object-fit: contain;
    }
    .app-title-block { min-width: 0; }
    .app-title-block h1 {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-title-block p {
      font-size: 12px;
      color: var(--cyan);
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-action-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--cyan);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .icon-action-btn:hover, .icon-action-btn:active {
      background: rgba(0, 229, 255, 0.12);
    }
    .header-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(14, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid #263b63;
      cursor: pointer;
      white-space: nowrap;
    }
    .header-pill-btn.cyan {
      background: var(--cyan-soft);
      color: var(--cyan);
      border-color: rgba(0, 229, 255, 0.35);
    }
    .header-pill-btn.gold {
      background: var(--gold-soft);
      color: var(--gold);
      border-color: rgba(255, 193, 7, 0.35);
    }

    /* Native Status Strip (just like real AdminPanelScreen role strip) */
    .role-strip {
      margin: 12px 14px 2px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
    }
    .role-strip.gold {
      background: rgba(255, 193, 7, 0.07);
      border-color: rgba(255, 193, 7, 0.3);
      color: var(--gold);
    }

    /* Native Android Horizontal Pill Tabs (matches real VidVora APK) */
    .tabs {
      display: flex;
      gap: 9px;
      padding: 12px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: transparent;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      border: 1px solid #223454;
      background: #0b1426;
      color: #cbd5e1;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #00e5ff, #06b6d4);
      color: #041320;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.25);
    }
    .tab-btn.active-gold {
      background: linear-gradient(135deg, #00e5ff, #06b6d4);
      color: #041320;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.25);
    }
    .badge-count {
      background: rgba(0, 0, 0, 0.22);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Main Content Area */
    .content {
      padding: 4px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .grid { display: grid; gap: 10px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .app-shell.phone-mode .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .card-glow-cyan { border-color: rgba(0, 229, 255, 0.34); background: linear-gradient(180deg, rgba(0, 229, 255, 0.07), var(--card)); }
    .card-glow-gold { border-color: rgba(255, 193, 7, 0.34); background: linear-gradient(180deg, rgba(255, 193, 7, 0.07), var(--card)); }
    .card-glow-green { border-color: rgba(34, 197, 94, 0.34); background: linear-gradient(180deg, rgba(34, 197, 94, 0.07), var(--card)); }
    .card-glow-red { border-color: rgba(239, 68, 68, 0.34); background: linear-gradient(180deg, rgba(239, 68, 68, 0.07), var(--card)); }
    .card-glow-purple { border-color: rgba(168, 85, 247, 0.34); background: linear-gradient(180deg, rgba(168, 85, 247, 0.07), var(--card)); }

    /* Real Android 3-column Install KPI tiles */
    .kpi-tile-center {
      text-align: center;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .kpi-tile-icon {
      font-size: 18px;
      line-height: 1;
      margin-bottom: 2px;
    }
    .kpi-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.55px; color: var(--muted); }
    .kpi-val { font-size: 23px; font-weight: 900; margin-top: 2px; letter-spacing: -0.3px; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .text-cyan { color: var(--cyan); }
    .text-gold { color: var(--gold); }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-purple { color: #d8b4fe; }
    .text-muted { color: var(--muted); }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .section-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 7px; }

    /* Bar chart */
    .chart-bars {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      align-items: end;
      height: 120px;
      padding-top: 14px;
    }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
    .bar-fill {
      width: 100%;
      max-width: 38px;
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(180deg, var(--cyan), #2563eb);
      transition: height 0.35s ease;
      min-height: 8px;
    }
    .bar-day { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .bar-amt { font-size: 9.5px; color: var(--cyan); font-weight: 700; }

    /* List Items */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item-row {
      background: #0c1426;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .item-main { display: flex; flex-direction: column; gap: 4px; min-width: 180px; flex: 1; }
    .item-title { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .item-meta { font-size: 12px; color: var(--muted); }
    .item-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
    }
    .pill-green { background: var(--green-soft); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.35); }
    .pill-gold { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(255, 193, 7, 0.35); }
    .pill-red { background: var(--red-soft); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }
    .pill-cyan { background: var(--cyan-soft); color: var(--cyan); border: 1px solid rgba(0, 229, 255, 0.35); }
    .pill-purple { background: var(--purple-soft); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.35); }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #081020;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #00e5ff); border-radius: 999px; }

    /* Inputs & Modals / Bottom Sheets */
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
    .field label { font-size: 12px; font-weight: 700; color: #cbd5e1; }
    .input {
      width: 100%;
      background: #080f1e;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
    }
    .input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.14); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 15, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      place-items: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-backdrop.open { display: grid; }
    .modal-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.72);
      max-height: 90dvh;
      overflow-y: auto;
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #334155;
      margin: 0 auto 14px;
      display: none;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-head h3 { font-size: 16px; font-weight: 800; }

    /* Telegram Bot Simulator */
    .tg-chat {
      background: #0b1422;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tg-top {
      background: #17212b;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #243242;
    }
    .tg-bot-id {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(0, 229, 255, 0.35);
    }
    .tg-messages {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-height: 300px;
      max-height: 440px;
      overflow-y: auto;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.05), transparent 65%);
    }
    .tg-bubble {
      max-width: 88%;
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tg-bot { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #24374d; }
    .tg-user { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
    .tg-inline-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
    .tg-inline-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e0f2fe;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tg-inline-btn:hover { background: rgba(56, 189, 248, 0.25); }
    .tg-keyboard {
      background: #17212b;
      padding: 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #243242;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
    .tg-key-btn {
      background: #243242;
      color: #f8fafc;
      border: 1px solid #32465c;
      padding: 11px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tg-key-btn:active { background: #2e4054; }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: calc(100% - 28px);
      max-width: 380px;
      pointer-events: none;
    }
    .toast {
      background: #0f1b33;
      border: 1px solid var(--cyan);
      color: var(--text);
      padding: 11px 15px;
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      width: 100%;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .banner-announce {
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.12), rgba(168, 85, 247, 0.12));
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 13px;
      padding: 10px 13px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .code-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #080f1e;
      border: 1px dashed rgba(0, 229, 255, 0.45);
      color: var(--cyan);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    /* =====================================================================
       MOBILE CHROME FULL-APP MODE (<= 768px)
       Hides ALL top controls / frames so it looks 100% like native Android app
       ===================================================================== */
    @media (max-width: 768px) {
      .desktop-bar,
      .floating-restore-bar,
      .phone-notch {
        display: none !important;
      }
      .stage {
        padding: 0 !important;
        display: block;
      }
      .app-shell,
      .app-shell.phone-mode {
        max-width: 100% !important;
        width: 100% !important;
        min-height: 100dvh;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: var(--bg);
      }
      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .content {
        padding: 4px 13px calc(24px + env(safe-area-inset-bottom, 0px));
      }
      .kpi-val { font-size: 21px; }
      .modal-backdrop {
        padding: 0;
        align-items: end;
      }
      .modal-card {
        max-width: 100%;
        border-radius: 22px 22px 0 0;
        border-bottom: 0;
        padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px));
      }
      .sheet-handle { display: block; }
      .tg-content-wrap {
        padding: 0 !important;
      }
      .tg-chat {
        border: 0;
        border-radius: 0;
        min-height: calc(100dvh - 67px);
      }
      .tg-messages {
        flex: 1;
        max-height: none;
      }
    }
  </style>
</head>

      }
      const todayBar = state.creator.dailyBars[state.creator.dailyBars.length - 1];
      if (todayBar) {
        todayBar.views += v;
        todayBar.amt = Math.round((todayBar.amt + earned) * 100) / 100;
      }
      saveState();
      showToast("👁️ +" + fmtNum(v) + " Views added → +" + fmtInr(earned) + " Wallet me credit!");
      render();
    }

      if (amt <= 0) return;
      state.creator.ownEarning = Math.round((state.creator.ownEarning + amt) * 100) / 100;
      const todayBar = state.creator.dailyBars[state.creator.dailyBars.length - 1];

    function simulateReferredViews(viewsCount, refId = null) {
      const target = refId
        ? state.referrals.find((r) => r.id === refId)
        : state.referrals.find((r) => r.status === "SUCCESSFUL") || state.referrals[0];
      if (!target) return;
      if (target.status !== "SUCCESSFUL") {
        target.status = "SUCCESSFUL";
      }
      const v = Math.max(100, Math.floor(Number(viewsCount) || 5000));
      const refCreatorEarned = Math.round((v / 1000) * CPM_PER_1000 * 100) / 100;
      const bonus7 = Math.round(refCreatorEarned * REFERRAL_RATE * 100) / 100;
      target.views += v;
      target.ownEarning = Math.round((target.ownEarning + refCreatorEarned) * 100) / 100;
      target.bonusToReferrer = Math.round((target.bonusToReferrer + bonus7) * 100) / 100;
      state.creator.referralEarning = Math.round((state.creator.referralEarning + bonus7) * 100) / 100;
      saveState();
      showToast(
        "🤝 " + target.name + " +" + fmtNum(v) + " views → Admin se 7% (+" + fmtInr(bonus7) + ") Referral Bonus add!"
      );
      render();
    }

    function render() {
      const shell = document.getElementById("appShell");
      shell.classList.toggle("phone-mode", Boolean(state.phoneMode));
      const layoutBtn = document.getElementById("layoutToggleBtn");
      if (layoutBtn) {
        layoutBtn.textContent = state.phoneMode ? "💻 Wide View" : "📱 Mobile View";
      }

      const mCr = document.getElementById("modeCreatorBtn");
      const mAd = document.getElementById("modeAdminBtn");
      const mTg = document.getElementById("modeTgBtn");
      if (mCr) mCr.className = "seg-btn" + (state.mode === "creator" ? " active" : "");
      if (mAd) mAd.className = "seg-btn" + (state.mode === "admin" ? " active-admin" : "");
      if (mTg) mTg.className = "seg-btn" + (state.mode === "telegram" ? " active-tg" : "");

      const root = document.getElementById("appRoot");
      if (state.mode === "admin") {
        root.innerHTML = renderAdminPanel();
      } else if (state.mode === "telegram") {
        root.innerHTML = renderTelegramDemo();
      } else {
        root.innerHTML = renderCreatorPanel();
      }
    }

    render();
  </script>
</body>
</html>
